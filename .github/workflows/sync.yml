name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/cmliu/edgetunnel.git || true
          git fetch upstream main

      - name: Check if update is needed
        id: check
        run: |
          TARGET_SHA="$(git rev-parse upstream/main)"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor "$TARGET_SHA" HEAD 2>/dev/null; then
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date with upstream/main ($TARGET_SHA)."
          else
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
            echo "Upstream update found: $TARGET_SHA"
          fi

      - name: Merge upstream while preserving fork workflows
        if: steps.check.outputs.needs_update == 'true'
        run: |
          BEFORE_SHA="$(git rev-parse HEAD)"
          TARGET_SHA="${{ steps.check.outputs.target_sha }}"

          # Upstream is allowed to change normal repository files, but this fork
          # owns its workflow files. Keeping the workflow tree unchanged also
          # lets the normal GITHUB_TOKEN push the resulting merge commit.
          set +e
          git merge "$TARGET_SHA" --no-commit --no-ff
          MERGE_STATUS=$?
          set -e

          # Resolve add/modify/delete conflicts under .github/workflows by
          # restoring the exact pre-sync state of the fork.
          git rm -r -f --ignore-unmatch .github/workflows >/dev/null 2>&1 || true
          git checkout "$BEFORE_SHA" -- .github/workflows
          git add -A .github/workflows

          # Never auto-resolve conflicts in application code.
          UNMERGED="$(git diff --name-only --diff-filter=U)"
          if [ -n "$UNMERGED" ]; then
            echo "::error::Upstream merge has non-workflow conflicts:"
            echo "$UNMERGED"
            git merge --abort || true
            exit 1
          fi

          if [ ! -f .git/MERGE_HEAD ]; then
            echo "::error::git merge failed before creating a merge state (status $MERGE_STATUS)."
            exit 1
          fi

          git commit -m "chore: sync upstream main"
          git push origin HEAD:main

      - name: Summary
        run: |
          if [ "${{ steps.check.outputs.needs_update }}" = "true" ]; then
            echo "### Synced upstream/main" >> "$GITHUB_STEP_SUMMARY"
            echo "- Commit: \`${{ steps.check.outputs.target_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Fork workflow files were preserved." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Nothing to update" >> "$GITHUB_STEP_SUMMARY"
          fi
